<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awards & Recognition — AgentBee</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #c8973a;
      --gold-light: #fdf6e7;
      --gold-mid:   #f5e4b8;
      --gold-dark:  #8a6420;
      --ink:        #17181c;
      --ink-mid:    #4a4d58;
      --ink-soft:   #8b8fa3;
      --surface:    #ffffff;
      --bg:         #f7f8fa;
      --border:     #e8e9ee;
      --blue:       #2563eb;
      --blue-light: #eff6ff;
      --radius:     10px;
      --radius-lg:  14px;
    }

    html, body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .widget {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    /* ── Header ── */
    .widget-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 28px;
    }

    .trophy-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold) 0%, #e8b44a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(200,151,58,0.28);
    }

    .widget-header-text h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .widget-header-text p {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 3px;
    }

    .award-count-badge {
      margin-left: auto;
      background: var(--gold-light);
      border: 1px solid var(--gold-mid);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold-dark);
      font-family: 'DM Mono', monospace;
      white-space: nowrap;
      align-self: flex-start;
      margin-top: 4px;
    }

    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      gap: 2px;
      background: var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 20px;
      width: fit-content;
    }

    .tab-btn {
      padding: 7px 18px;
      border-radius: 8px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-soft);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* ── Loading / empty ── */
    .state-loading, .state-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .state-loading .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Group rows (agent or institution) ── */
    .group-list { display: flex; flex-direction: column; gap: 6px; }

    .group-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .group-row:hover { border-color: #d0d3de; }
    .group-row.open  { border-color: var(--gold-mid); }

    .group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }

    .group-avatar {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: var(--gold-light);
      border: 1px solid var(--gold-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      color: var(--gold);
    }

    .group-main { flex: 1; min-width: 0; }

    .group-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-meta {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .group-meta .country-tag {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      color: var(--ink-mid);
      letter-spacing: 0.02em;
    }

    .awards-pill {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--gold-dark);
      background: var(--gold-light);
      border: 1px solid var(--gold-mid);
      border-radius: 20px;
      padding: 3px 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chevron {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--ink-soft);
      transition: transform 0.2s;
    }

    .group-row.open .chevron { transform: rotate(180deg); }

    /* ── Award entries ── */
    .awards-list {
      display: none;
      border-top: 1px solid var(--gold-mid);
      background: var(--gold-light);
    }

    .group-row.open .awards-list { display: block; }

    .award-entry {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px 14px 20px;
      border-bottom: 1px solid rgba(200,151,58,0.15);
      transition: background 0.1s;
    }

    .award-entry:last-child { border-bottom: none; }
    .award-entry:hover { background: rgba(200,151,58,0.06); }

    .award-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--gold) 0%, #e8b44a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 1px;
      box-shadow: 0 1px 4px rgba(200,151,58,0.3);
    }

    .award-body { flex: 1; min-width: 0; }

    .award-desc {
      font-size: 13px;
      color: var(--ink);
      line-height: 1.5;
    }

    .award-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 7px;
      flex-wrap: wrap;
    }

    .award-date {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      letter-spacing: 0.03em;
    }

    .award-dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--gold-mid);
      flex-shrink: 0;
    }

    .award-issuer-tag {
      font-size: 11px;
      color: var(--gold-dark);
      font-weight: 500;
    }

    .award-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      text-decoration: none;
      background: var(--blue-light);
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 3px 9px;
      transition: all 0.12s;
      margin-left: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .award-link:hover {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    .award-link svg { flex-shrink: 0; }

    /* ── No source URL fallback ── */
    .award-no-link {
      font-size: 11px;
      color: var(--ink-soft);
      margin-left: auto;
      white-space: nowrap;
      font-style: italic;
      flex-shrink: 0;
    }

    /* ── Error ── */
    .state-error {
      text-align: center;
      padding: 32px 20px;
      color: #b91c1c;
      font-size: 13px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
    }

    @media (max-width: 560px) {
      .award-link, .award-no-link { margin-left: 0; }
      .award-footer { gap: 7px; }
      .widget-header { flex-wrap: wrap; }
      .award-count-badge { margin-left: 0; }
    }
  </style>
</head>
<body>
<div class="widget">

  <div class="widget-header">
    <div class="trophy-mark">🏆</div>
    <div class="widget-header-text">
      <h1>Awards &amp; Recognition</h1>
      <p>Acknowledged agents in our network</p>
    </div>
    <div class="award-count-badge" id="countBadge" style="display:none;"></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabAgent">By agent</button>
    <button class="tab-btn" id="tabInstitution">By institution</button>
  </div>

  <div id="tabContentAgent">
    <div class="state-loading" id="loadingAgent">
      <div class="spinner"></div>
      Loading awards…
    </div>
    <div class="group-list" id="agentList" style="display:none;"></div>
    <div class="state-empty" id="emptyAgent" style="display:none;">No awards on record yet.</div>
    <div class="state-error" id="errorAgent" style="display:none;"></div>
  </div>

  <div id="tabContentInstitution" style="display:none;">
    <div class="state-loading" id="loadingInst" style="display:none;">
      <div class="spinner"></div>
      Loading awards…
    </div>
    <div class="group-list" id="instList" style="display:none;"></div>
    <div class="state-empty" id="emptyInst" style="display:none;">No awards on record yet.</div>
    <div class="state-error" id="errorInst" style="display:none;"></div>
  </div>

</div>

<script>
let _allAwards = [];
let _dataLoaded = false;
let _activeTab = 'agent';

// ── Format date ─────────────────────────────────────────────────
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
}

// ── Fetch from proxy ─────────────────────────────────────────────
async function loadAwards() {
  const res = await fetch('/api/awards');
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  return data.awards || [];
}

// ── Group by agent ───────────────────────────────────────────────
function groupByAgent(awards) {
  const map = new Map();
  awards.forEach(a => {
    if (!a.agent) return;
    const key = a.agent.id;
    if (!map.has(key)) map.set(key, { agent: a.agent, awards: [] });
    map.get(key).awards.push(a);
  });
  // Sort alphabetically
  return [...map.values()].sort((a, b) => a.agent.agency_name.localeCompare(b.agent.agency_name));
}

// ── Group by institution ─────────────────────────────────────────
function groupByInstitution(awards) {
  const map = new Map();
  awards.forEach(a => {
    if (!a.institutions.length) {
      // No issuer linked — put under "Unattributed"
      const key = '__none__';
      if (!map.has(key)) map.set(key, { institution: { id: '__none__', name: 'No institution linked' }, awards: [] });
      map.get(key).awards.push(a);
      return;
    }
    a.institutions.forEach(inst => {
      if (!map.has(inst.id)) map.set(inst.id, { institution: inst, awards: [] });
      map.get(inst.id).awards.push(a);
    });
  });
  return [...map.values()]
    .filter(g => g.institution.id !== '__none__')
    .sort((a, b) => a.institution.name.localeCompare(b.institution.name));
}

// ── Render helpers ───────────────────────────────────────────────
function chevronSVG() {
  return `<svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6l4 4 4-4"/>
  </svg>`;
}

function awardEntryHTML(award, showAgent, showInstitution) {
  const dateStr = fmtDate(award.date);
  const issuers = award.institutions.map(i => i.name).join(', ');
  const agentName = award.agent ? award.agent.agency_name : '';

  const linkBtn = award.source_url
    ? `<a class="award-link" href="${award.source_url}" target="_blank" rel="noopener">
        View report
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1.5 8.5l7-7M4 1.5h4.5v4.5"/>
        </svg>
      </a>`
    : `<span class="award-no-link">No report link</span>`;

  const contextParts = [];
  if (showAgent && agentName) contextParts.push(`<span class="award-issuer-tag">Agent: ${escHtml(agentName)}</span>`);
  if (showInstitution && issuers) {
    contextParts.push(`<span class="award-dot"></span>`);
    contextParts.push(`<span class="award-issuer-tag">Issued by: ${escHtml(issuers)}</span>`);
  }

  return `<div class="award-entry">
    <div class="award-icon">🏅</div>
    <div class="award-body">
      <div class="award-desc">${escHtml(award.description || 'Award received.')}</div>
      <div class="award-footer">
        <span class="award-date">${escHtml(dateStr)}</span>
        ${contextParts.join('')}
        ${linkBtn}
      </div>
    </div>
  </div>`;
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Render agent tab ─────────────────────────────────────────────
function renderAgentTab(groups) {
  const container = document.getElementById('agentList');

  if (!groups.length) {
    document.getElementById('emptyAgent').style.display = 'block';
    return;
  }

  container.innerHTML = groups.map((g, gi) => {
    const agent = g.agent;
    const countryMeta = [agent.country, agent.jurisdiction]
      .filter(Boolean)
      .filter((v, i, a) => a.indexOf(v) === i) // dedupe if same
      .join(' · ');
    const awardsHTML = g.awards.map(a => awardEntryHTML(a, false, true)).join('');

    return `<div class="group-row" id="agent-row-${gi}">
      <div class="group-header" data-group="agent-${gi}">
        <div class="group-avatar">🏆</div>
        <div class="group-main">
          <div class="group-name">${escHtml(agent.agency_name)}</div>
          <div class="group-meta">
            ${countryMeta ? `<span class="country-tag">${escHtml(countryMeta)}</span>` : ''}
          </div>
        </div>
        <div class="awards-pill">
          🏅 ${g.awards.length} award${g.awards.length !== 1 ? 's' : ''}
        </div>
        ${chevronSVG()}
      </div>
      <div class="awards-list">${awardsHTML}</div>
    </div>`;
  }).join('');

  container.style.display = 'flex';
}

// ── Render institution tab ───────────────────────────────────────
function renderInstTab(groups) {
  const container = document.getElementById('instList');

  if (!groups.length) {
    document.getElementById('emptyInst').style.display = 'block';
    return;
  }

  container.innerHTML = groups.map((g, gi) => {
    const inst = g.institution;
    const awardsHTML = g.awards.map(a => awardEntryHTML(a, true, false)).join('');

    return `<div class="group-row" id="inst-row-${gi}">
      <div class="group-header" data-group="inst-${gi}">
        <div class="group-avatar">🏛️</div>
        <div class="group-main">
          <div class="group-name">${escHtml(inst.name)}</div>
          <div class="group-meta" style="color:var(--ink-soft);font-size:12px;">Issuing institution</div>
        </div>
        <div class="awards-pill">
          🏅 ${g.awards.length} award${g.awards.length !== 1 ? 's' : ''}
        </div>
        ${chevronSVG()}
      </div>
      <div class="awards-list">${awardsHTML}</div>
    </div>`;
  }).join('');

  container.style.display = 'flex';
}

// ── Toggle expand/collapse ───────────────────────────────────────
document.addEventListener('click', function(e) {
  const header = e.target.closest('[data-group]');
  if (!header) return;
  const groupId = header.getAttribute('data-group');
  const [type, idx] = groupId.split('-');
  const rowId = type === 'agent' ? `agent-row-${idx}` : `inst-row-${idx}`;
  const row = document.getElementById(rowId);
  if (row) row.classList.toggle('open');
});

// ── Tab switching ────────────────────────────────────────────────
document.getElementById('tabAgent').addEventListener('click', function() {
  _activeTab = 'agent';
  document.getElementById('tabAgent').classList.add('active');
  document.getElementById('tabInstitution').classList.remove('active');
  document.getElementById('tabContentAgent').style.display = 'block';
  document.getElementById('tabContentInstitution').style.display = 'none';
});

document.getElementById('tabInstitution').addEventListener('click', function() {
  _activeTab = 'institution';
  document.getElementById('tabInstitution').classList.add('active');
  document.getElementById('tabAgent').classList.remove('active');
  document.getElementById('tabContentAgent').style.display = 'none';
  document.getElementById('tabContentInstitution').style.display = 'block';

  // Render institution tab on first view
  if (!document.getElementById('instList').innerHTML) {
    const groups = groupByInstitution(_allAwards);
    document.getElementById('loadingInst').style.display = 'none';
    renderInstTab(groups);
  }
});

// ── Init ─────────────────────────────────────────────────────────
async function init() {
  try {
    _allAwards = await loadAwards();
    _dataLoaded = true;

    const totalAwards = _allAwards.length;
    const badge = document.getElementById('countBadge');
    badge.textContent = `${totalAwards} award${totalAwards !== 1 ? 's' : ''}`;
    badge.style.display = 'block';

    document.getElementById('loadingAgent').style.display = 'none';

    const agentGroups = groupByAgent(_allAwards);
    renderAgentTab(agentGroups);

  } catch(e) {
    document.getElementById('loadingAgent').style.display = 'none';
    const err = document.getElementById('errorAgent');
    err.style.display = 'block';
    err.textContent = 'Could not load awards data. Please try again later.';
    console.error('Awards widget error:', e);
  }
}

init();
</script>
</body>
</html>
