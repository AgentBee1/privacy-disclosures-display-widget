<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Disclosures — AgentBee</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 1.5rem 1.75rem;
    }

    /* Header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .page-label {
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: .35rem;
    }

    .page-title {
      font-size: 26px;
      font-weight: 600;
      color: #111;
      line-height: 1.1;
    }

    .page-subtitle {
      font-size: 13px;
      color: #888;
      margin-top: .25rem;
    }

    /* Summary badge */
    .summary-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      border: 1.5px solid #f0b8b8;
      font-size: 13px;
      font-weight: 600;
      background: #fff;
      color: #c0392b;
    }

    .summary-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e24b4a;
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .search-wrap {
      position: relative;
      width: 280px;
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #bbb;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      outline: none;
    }

    .search-input:focus { border-color: #bbb; }

    .results-count {
      font-size: 13px;
      color: #aaa;
    }

    /* Table container */
    .table-wrap {
      background: #fff;
      border: 1.5px solid #e8e8e4;
      border-radius: 12px;
      overflow: hidden;
      max-height: 70vh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #aaa;
      padding: 10px 16px;
      text-align: left;
      border-bottom: 1.5px solid #efefed;
      background: #fff;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #f0f0ee;
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafaf8; }

    tbody td {
      padding: 14px 16px;
      font-size: 13.5px;
      color: #333;
      vertical-align: middle;
    }

    /* Student name */
    .student-name {
      font-weight: 600;
      font-size: 14px;
      color: #111;
    }

    /* Date */
    .date-cell {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
    }

    /* Source link */
    .source-link {
      font-size: 13px;
      color: #1a6eb5;
      text-decoration: none;
      font-weight: 500;
    }

    .source-link:hover { text-decoration: underline; }

    .source-plain {
      font-size: 13px;
      color: #333;
    }

    /* View document */
    .doc-link {
      font-size: 13px;
      font-weight: 700;
      color: #1a6eb5;
      text-decoration: none;
    }

    .doc-link:hover { text-decoration: underline; }

    /* Uploader handle */
    .uploader-handle {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: #888;
      background: #f5f5f3;
      border: 1px solid #e5e5e2;
      border-radius: 5px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    /* Empty / loading / error states */
    .state-cell {
      text-align: center;
      padding: 3rem;
      color: #aaa;
      font-size: 13px;
    }

    .error-box {
      padding: 1rem;
      background: #fdf0f0;
      border-radius: 8px;
      color: #c0392b;
      font-size: 13px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<div id="app">

  <div class="page-header">
    <div>
      <div class="page-label">AgentBee · Privacy Disclosures</div>
      <div class="page-title" id="instName">Loading…</div>
      <div class="page-subtitle" id="instSubtitle"></div>
    </div>
    <div id="summaryBadge" style="display:none;">
      <div class="summary-badge">
        <div class="summary-badge-dot"></div>
        <span id="badgeCount"></span>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="6.5" cy="6.5" r="4.5"/><path d="M10.5 10.5l3 3"/>
      </svg>
      <input class="search-input" id="filterInput" placeholder="Filter by student name or uploader…" oninput="renderTable()" />
    </div>
    <span class="results-count" id="resultsCount"></span>
  </div>

  <div id="errorBox" style="display:none;" class="error-box"></div>

  <div class="table-wrap" id="tableWrap">
    <table>
      <thead>
        <tr>
          <th>Student</th>
          <th>Date</th>
          <th>Source</th>
          <th>Document</th>
          <th>Uploader Handle</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" class="state-cell">Loading disclosures…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://mtatzzrbapftzwuxrcko.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10YXR6enJiYXBmdHp3dXhyY2tvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxOTg5NTksImV4cCI6MjA4OTc3NDk1OX0.qPUvwuA-bPhMm33QUT3VKE0H-Bv5zeBDSeSmqt4pCSU';
const H = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

let allDisclosures = [];

async function api(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: H });
  if (!r.ok) throw new Error(`API error ${r.status}`);
  return r.json();
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderTable() {
  const filter = document.getElementById('filterInput').value.toLowerCase();
  const tbody  = document.getElementById('tableBody');
  const countEl = document.getElementById('resultsCount');

  const filtered = allDisclosures.filter(d => {
    if (!filter) return true;
    const student  = `${d.student_first_name} ${d.student_last_name}`.toLowerCase();
    const uploader = (d.uploader_handle || '').toLowerCase();
    return student.includes(filter) || uploader.includes(filter);
  });

  countEl.textContent = `${filtered.length} shown`;

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="state-cell">${allDisclosures.length ? 'No disclosures match your search.' : 'No privacy disclosures on record for this institution.'}</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(d => {
    // Student — first initial + last name
    const initial  = (d.student_first_name || '').charAt(0).toUpperCase();
    const lastName = d.student_last_name || '';
    const student  = initial ? `${initial}. ${lastName}` : lastName;

    // Source
    const sourceCell = d.source_url && d.source_url.startsWith('http')
      ? `<a class="source-link" href="${escHtml(d.source_url)}" target="_blank" rel="noopener">${escHtml(d.source_label || 'Source')} ↗</a>`
      : `<span class="source-plain">${escHtml(d.source_label || '—')}</span>`;

    // Document
    const docCell = d.document_url && d.document_url.startsWith('http')
      ? `<a class="doc-link" href="${escHtml(d.document_url)}" target="_blank" rel="noopener">View Document ↗</a>`
      : '<span style="color:#ccc;">—</span>';

    // Uploader
    const uploaderCell = d.uploader_handle
      ? `<span class="uploader-handle">@${escHtml(d.uploader_handle)}</span>`
      : '<span style="color:#ccc;">—</span>';

    return `
      <tr>
        <td><span class="student-name">${escHtml(student)}</span></td>
        <td><span class="date-cell">${fmtDate(d.document_date)}</span></td>
        <td>${sourceCell}</td>
        <td>${docCell}</td>
        <td>${uploaderCell}</td>
      </tr>`;
  }).join('');
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('institution') || params.get('id') || '';

  if (!id) {
    document.getElementById('instName').textContent = 'No institution specified';
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="state-cell">Pass <code>?institution={uuid}</code> in the URL.</td></tr>';
    return;
  }

  try {
    // Load institution name
    const instData = await api(`institutions?id=eq.${id}&select=id,name`);
    const inst = instData[0];
    document.getElementById('instName').textContent = inst ? inst.name : 'Unknown Institution';

    // Load disclosures
    const data = await api(
      `privacy_disclosures?institution_id=eq.${id}&select=id,student_first_name,student_last_name,document_date,source_label,source_url,document_url,uploader_handle&order=document_date.desc`
    );

    allDisclosures = data || [];

    // Update subtitle and badge
    const count = allDisclosures.length;
    document.getElementById('instSubtitle').textContent = count > 0
      ? `${count} disclosure${count !== 1 ? 's' : ''} on record`
      : '';

    if (count > 0) {
      document.getElementById('badgeCount').textContent = `${count} Disclosure${count !== 1 ? 's' : ''}`;
      document.getElementById('summaryBadge').style.display = 'block';
    }

    document.getElementById('resultsCount').textContent = `${count} shown`;
    renderTable();

  } catch(e) {
    document.getElementById('instName').textContent = 'Error loading data';
    const errBox = document.getElementById('errorBox');
    errBox.textContent = `Error: ${e.message}`;
    errBox.style.display = 'block';
    document.getElementById('tableBody').innerHTML = '';
    document.getElementById('tableWrap').style.display = 'none';
  }
}

load();
</script>
</body>
</html>
